services:
  - type: web
    name: agorazure
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./agorazure.db
